<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="tab-title">doverdraw</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; user-select: none; touch-action: manipulation; }
    body { background: #1852b4; color: #000; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background: #1852b4; padding: 10px; }
    .logo-container { font-size: clamp(36px, 8vw, 56px); font-weight: 900; color: #fff; font-family: 'Comic Sans MS', cursive, sans-serif; text-shadow: 3px 3px 0px #000; margin-bottom: 12px; text-align: center; }
    
    .login-card { background: #0c2b64; padding: 16px; border-radius: 8px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 0 rgba(0,0,0,0.3); }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 4px; border: none; font-size: 16px; font-weight: bold; outline: none; }

    .avatar-picker { background: #09204c; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .avatar-preview-box { width: 70px; height: 70px; background: #fff; border-radius: 50%; border: 3px solid #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    
    .customizer-controls { width: 100%; display: flex; flex-direction: column; gap: 4px; }
    .customizer-row { display: flex; justify-content: space-between; align-items: center; background: #0e2858; padding: 5px 8px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: bold; }
    .customizer-row button { background: #fff; border: 1px solid #000; border-radius: 3px; font-weight: bold; width: 24px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #000; }
    .customizer-row button:hover { background: #ddd; }
    .customizer-row input[type="color"] { -webkit-appearance: none; border: 1px solid #000; width: 26px; height: 22px; border-radius: 3px; cursor: pointer; padding: 0; background: none; }
    .customizer-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .customizer-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

    .btn-play { background: #53d400; color: #fff; border: none; padding: 10px; font-size: 22px; font-weight: 900; border-radius: 6px; cursor: pointer; text-shadow: 2px 2px 0px #000; box-shadow: 0 4px 0 #3a9600; text-align: center; margin-top: 2px; }
    .btn-play:hover { background: #47b800; }

    #game-screen { display: none; width: 100%; max-width: 1000px; height: 100vh; max-height: 620px; background: #fff; border-radius: 6px; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; border: 3px solid #0c2b64; position: relative; }
    
    header { background: #fff; height: 48px; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; font-size: 14px; font-weight: bold; flex-shrink: 0; }
    .timer-box { font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 4px; }
    .word-box { font-size: clamp(16px, 4vw, 24px); font-weight: 900; letter-spacing: 3px; text-align: center; overflow: hidden; white-space: nowrap; filter: blur(6px); transition: filter 0.2s ease; }

    .game-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    
    .sidebar-left { width: 180px; background: #eee; border-right: 2px solid #ccc; padding: 6px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .player-card { background: #fff; border: 2px solid #ccc; border-radius: 4px; padding: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .player-card.drawer { border-color: #53d400; background: #eaffd9; }
    .player-rank { font-weight: bold; color: #555; width: 18px; }
    .player-info { overflow: hidden; flex: 1; }
    .player-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-score { color: #666; font-size: 11px; }

    .canvas-area { flex: 1; display: flex; flex-direction: column; background: #5a5e73; position: relative; min-width: 0; min-height: 0; }
    .canvas-wrapper { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #5a5e73; }
    canvas { background: #ffffff; cursor: crosshair; touch-action: none; width: 100%; height: 100%; object-fit: contain; }

    .overlay-modal { position: absolute; inset: 0; background: rgba(90, 94, 115, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10; padding: 10px; }
    .overlay-modal h2 { color: #fff; font-size: 22px; text-align: center; }
    .word-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .word-opt-btn { background: #fff; border: 2px solid #000; color: #000; padding: 10px 16px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .word-opt-btn:hover { background: #eee; }

    .toolbar { background: #0f2c59; min-height: 54px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #051937; flex-shrink: 0; gap: 8px; flex-wrap: wrap; }
    .palette { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; max-width: 100%; max-height: 44px; overflow: hidden; }
    .color-swatch { width: 18px; height: 18px; border: 1px solid #000; cursor: pointer; border-radius: 2px; flex-shrink: 0; }
    .color-swatch.active { outline: 2px solid #fff; z-index: 2; }
    
    .tool-group { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
    .tool-btn { width: 28px; height: 28px; background: #fff; border: 2px solid #000; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .tool-btn.active { background: #ddd; }

    .sidebar-right { width: 220px; background: #fff; border-left: 2px solid #ccc; display: flex; flex-direction: column; flex-shrink: 0; }
    .chat-messages { flex: 1; padding: 8px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .chat-input-box { padding: 6px; background: #eee; border-top: 1px solid #ccc; }
    .chat-input-box input { width: 100%; padding: 6px 8px; border: 1px solid #bbb; border-radius: 4px; outline: none; font-size: 12px; }
    
    .chat-msg { word-break: break-word; color: #333; padding: 3px 5px; border-radius: 3px; }
    .chat-msg b { color: #000; }
    .chat-msg.system { color: #1852b4; font-weight: bold; background: #eef4ff; }
    .chat-msg.correct { color: #2e7d32; font-weight: bold; background: #e8f5e9; }
    .chat-msg.close { color: #d84315; font-weight: bold; background: #fbe9e7; }

    /* SnithikHack floating menu styling */
    #snithik-hack-menu { position: absolute; top: 55px; right: 15px; width: 230px; background: rgba(15, 44, 89, 0.96); border: 2px solid #53d400; border-radius: 6px; padding: 10px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; flex-direction: column; gap: 8px; color: #fff; font-size: 12px; }
    .hack-title { font-weight: bold; color: #53d400; text-align: center; border-bottom: 1px solid #53d400; padding-bottom: 4px; font-size: 13px; }
    .hack-row { display: flex; justify-content: space-between; align-items: center; }
    .hack-btn { background: #ff2600; color: #fff; border: none; padding: 6px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; }
    .hack-btn:hover { background: #d92100; }
    .hack-toggle-btn { background: #53d400; color: #000; border: none; padding: 4px 8px; border-radius: 3px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- SnithikHack Floating Overlay Panel -->
  <div id="snithik-hack-menu">
    <div class="hack-title">⚡ SnithikHack v2.5 ⚡</div>
    <div class="hack-row">
      <span>Secret Word Espionage:</span>
      <button class="hack-toggle-btn" onclick="toggleSnithikWord()">Reveal</button>
    </div>
    <div id="snithik-word-display" style="background:#0c2b64; padding:6px; border-radius:4px; text-align:center; font-weight:bold; color:#ffca3a; letter-spacing:1px;">Waiting...</div>
    <div class="hack-row" style="margin-top:4px;">
      <span>Crash Target to Calculator:</span>
    </div>
    <button class="hack-btn" onclick="triggerCalculatorCrash()">CRASH LOBBY (Calc Mode)</button>
  </div>

  <div id="login-screen">
    <div class="logo-container">doverdraw</div>
    <div class="login-card">
      <div class="input-row">
        <input type="text" id="username" placeholder="Enter your name" maxlength="15" />
      </div>

      <div class="avatar-picker">
        <div class="avatar-preview-box" id="avatar-svg-container"></div>
        <div class="customizer-controls">
          <div class="customizer-row">
            <span>Body Color:</span>
            <input type="color" id="avatar-color-wheel" value="#ffca3a" onchange="setAvatarColor(this.value)">
          </div>
          <div class="customizer-row">
            <span>Eyes Style:</span>
            <div style="display:flex; gap:4px; align-items:center;">
              <button onclick="cycleAvatar('eyes', -1)">&lt;</button>
              <span id="eyes-label" style="min-width:65px; text-align:center;">Normal</span>
              <button onclick="cycleAvatar('eyes', 1)">&gt;</button>
            </div>
          </div>
          <div class="customizer-row">
            <span>Mouth Style:</span>
            <div style="display:flex; gap:4px; align-items:center;">
              <button onclick="cycleAvatar('mouth', -1)">&lt;</button>
              <span id="mouth-label" style="min-width:65px; text-align:center;">Smile</span>
              <button onclick="cycleAvatar('mouth', 1)">&gt;</button>
            </div>
          </div>
        </div>
      </div>

      <button class="btn-play" onclick="joinGame()">Play!</button>
    </div>
  </div>

  <div id="game-screen">
    <header>
      <div class="timer-box">&#8982; <span id="timer-display">60</span></div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="word-box" id="word-hint-display">_ _ _ _ _</div>
        <button id="toggle-word-btn" onclick="toggleSecretWordVisibility()" title="Toggle Secret Word Visibility" style="background: rgba(0,0,0,0.06); border: 1px solid #bbb; border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 14px; opacity: 0.5;">👁️</button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button onclick="toggleSnithikMenu()" style="background:#53d400; border:none; border-radius:4px; padding:4px 8px; font-weight:bold; cursor:pointer; font-size:11px;" title="Toggle SnithikHack">⚡ Hack</button>
        <div id="round-display">Round 1 of 3</div>
      </div>
    </header>

    <div class="game-body">
      <div class="sidebar-left" id="player-list"></div>

      <div class="canvas-area">
        <div class="canvas-wrapper">
          <canvas id="drawing-canvas" width="800" height="600"></canvas>

          <div class="overlay-modal" id="word-modal">
            <h2>Choose a word</h2>
            <div class="word-options" id="word-options-container"></div>
          </div>
        </div>

        <div class="toolbar">
          <div class="palette" id="color-palette"></div>
          <input type="color" id="custom-color-picker" value="#000000" onchange="setCustomColor(this.value)" title="Custom Color" style="width: 28px; height: 26px; border: 1px solid #000; border-radius: 3px; cursor: pointer; background: none;">
          
          <div style="display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.25); padding: 3px 6px; border-radius: 6px;">
            <label for="brush-size" style="color: #fff; font-size: 11px; font-weight: bold;">Size:</label>
            <input type="range" id="brush-size" min="1" max="30" value="4" oninput="setBrushSize(this.value)" style="width: 60px; cursor: pointer;">
            <span id="brush-size-display" style="color: #fff; font-size: 11px; min-width: 14px; text-align: center;">4</span>
          </div>

          <div class="tool-group">
            <button class="tool-btn active" id="btn-draw" onclick="setTool('draw')" title="Brush">&#9999;&#65039;</button>
            <button class="tool-btn" id="btn-fill" onclick="setTool('fill')" title="Fill Bucket">&#129637;</button>
            <button class="tool-btn" id="btn-erase" onclick="setTool('erase')" title="Eraser">&#9632;</button>
            <button class="tool-btn" onclick="undoCanvas()" title="Undo">&#8617;&#65039;</button>
            <button class="tool-btn" onclick="clearCanvas()" title="Clear Canvas">&#128465;</button>
            <button class="tool-btn" id="btn-hint" onclick="triggerHint()" title="Request Hint" style="display: none;">&#11088;</button>
          </div>
        </div>
      </div>

      <div class="sidebar-right">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-box">
          <input type="text" id="chat-input" placeholder="Type your guess here..." onkeydown="handleChatKey(event)" />
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let myAvatar = { color: '#ffca3a', eyes: 0, mouth: 0 };
    const eyeStyles = ['Normal', 'Happy', 'Wink', 'Cool', 'Surprised', 'Star', 'Dizzy', 'Sleepy', 'Laser', 'Crying'];
    const mouthStyles = ['Smile', 'Grin', 'Straight', 'Sad', 'Tongue', 'BigSmile', 'Frown', 'Vampire', 'Smirk'];
    let realSecretWord = '???';

    // Global Key Listener for Ctrl + E
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === 'e') {
        e.preventDefault();
        toggleSnithikMenu();
      }
    });

    function toggleSnithikMenu() {
      const menu = document.getElementById('snithik-hack-menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleSnithikWord() {
      const disp = document.getElementById('snithik-word-display');
      disp.innerText = realSecretWord;
    }

    // Broadcast a custom payload that forces connected clients into calculator redirect mode
    socket.on('snithikCrashProtocol', () => {
      document.body.innerHTML = `
        <div style="background:#000; color:#0f0; width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:monospace;">
          <h1 style="font-size:40px; margin-bottom:20px;">⚡ SNITHIKHACK TERMINATED ⚡</h1>
          <p style="font-size:18px; margin-bottom:30px;">Redirecting target to Calculator...</p>
          <iframe src="data:text/html;charset=utf-8,
            <html><body><h2 style='text-align:center;font-family:sans-serif;margin-top:20vh;'>Calculator Fallback Mode</h2>
            <div style='max-width:200px;margin:auto;background:#eee;padding:20px;border-radius:8px;border:2px solid #333;'>
            <input id='calc' style='width:100%%;font-size:20px;padding:8px;margin-bottom:10px;' value='0'/>
            <div style='display:grid;grid-template-columns:repeat(4,1fr);gap:5px;'>
            <button onclick=\"calc.value+='7'\">7</button><button onclick=\"calc.value+='8'\">8</button><button onclick=\"calc.value+='9'\">9</button><button onclick=\"calc.value+='+'\">+</button>
            <button onclick=\"calc.value+='4'\">4</button><button onclick=\"calc.value+='5'\">5</button><button onclick=\"calc.value+='6'\">6</button><button onclick=\"calc.value+='-'\">-</button>
            <button onclick=\"calc.value+='1'\">1</button><button onclick=\"calc.value+='2'\">2</button><button onclick=\"calc.value+='3'\">3</button><button onclick=\"calc.value+='*'\">*</button>
            <button onclick=\"calc.value='0'\">C</button><button onclick=\"calc.value+='0'\">0</button><button onclick=\"calc.value=eval(calc.value)\">=</button><button onclick=\"calc.value+='/'\">/</button>
            </div></div></body></html>" 
            style="width:400px; height:350px; border:3px solid #0f0; border-radius:8px;"></iframe>
        </div>
      `;
    });

    function triggerCalculatorCrash() {
      if (confirm('Deploying Calculator Crash Protocol to lobby?')) {
        socket.emit('triggerSnithikCrash');
        alert('Calculator crash signal deployed!');
      }
    }

    function renderAvatarSvg(av) {
      const col = av.color || '#ffca3a';
      const eyeName = eyeStyles[av.eyes % eyeStyles.length];
      const mouthName = mouthStyles[av.mouth % mouthStyles.length];
      
      let eyeMarkup = `<circle cx="35" cy="40" r="6" fill="#000"/><circle cx="65" cy="40" r="6" fill="#000"/>`;
      if (eyeName === 'Happy') eyeMarkup = `<path d="M 29 42 Q 35 34 41 42" stroke="#000" stroke-width="4" fill="none"/><path d="M 59 42 Q 65 34 71 42" stroke="#000" stroke-width="4" fill="none"/>`;
      if (eyeName === 'Wink') eyeMarkup = `<circle cx="35" cy="40" r="6" fill="#000"/><path d="M 59 40 L 71 40" stroke="#000" stroke-width="4"/>`;
      if (eyeName === 'Cool') eyeMarkup = `<rect x="25" y="34" width="22" height="12" fill="#000" rx="2"/><rect x="53" y="34" width="22" height="12" fill="#000" rx="2"/><line x1="47" y1="38" x2="53" y2="38" stroke="#000" stroke-width="4"/>`;
      if (eyeName === 'Surprised') eyeMarkup = `<circle cx="35" cy="40" r="8" fill="none" stroke="#000" stroke-width="3"/><circle cx="65" cy="40" r="8" fill="none" stroke="#000" stroke-width="3"/>`;
      if (eyeName === 'Star') eyeMarkup = `<polygon points="35,31 37,37 43,37 38,41 40,47 35,43 30,47 32,41 27,37 33,37" fill="#000"/><polygon points="65,31 67,37 73,37 68,41 70,47 65,43 60,47 62,41 57,37 63,37" fill="#000"/>`;
      if (eyeName === 'Dizzy') eyeMarkup = `<path d="M 29 35 L 41 45 M 41 35 L 29 45" stroke="#000" stroke-width="3"/><path d="M 59 35 L 71 45 M 71 35 L 59 45" stroke="#000" stroke-width="3"/>`;
      if (eyeName === 'Sleepy') eyeMarkup = `<path d="M 29 40 L 41 40" stroke="#000" stroke-width="4"/><path d="M 59 40 L 71 40" stroke="#000" stroke-width="4"/>`;
      if (eyeName === 'Laser') eyeMarkup = `<circle cx="35" cy="40" r="6" fill="#ff0000"/><circle cx="65" cy="40" r="6" fill="#ff0000"/>`;
      if (eyeName === 'Crying') eyeMarkup = `<circle cx="35" cy="40" r="6" fill="#000"/><circle cx="65" cy="40" r="6" fill="#000"/><path d="M 35 48 Q 33 60 35 62" stroke="#00bfff" stroke-width="3" fill="none"/><path d="M 65 48 Q 63 60 65 62" stroke="#00bfff" stroke-width="3" fill="none"/>`;

      let mouthMarkup = `<path d="M 35 65 Q 50 78 65 65" stroke="#000" stroke-width="4" fill="none"/>`;
      if (mouthName === 'Grin') mouthMarkup = `<path d="M 33 62 Q 50 82 67 62 Z" fill="#000"/>`;
      if (mouthName === 'Straight') mouthMarkup = `<line x1="35" y1="66" x2="65" y2="66" stroke="#000" stroke-width="4"/>`;
      if (mouthName === 'Sad') mouthMarkup = `<path d="M 35 72 Q 50 58 65 72" stroke="#000" stroke-width="4" fill="none"/>`;
      if (mouthName === 'Tongue') mouthMarkup = `<path d="M 35 64 Q 50 74 65 64 Z" fill="#000"/><path d="M 45 69 Q 50 84 55 69 Z" fill="#ff5959"/>`;
      if (mouthName === 'BigSmile') mouthMarkup = `<path d="M 30 60 Q 50 90 70 60 Z" fill="#000"/>`;
      if (mouthName === 'Frown') mouthMarkup = `<path d="M 35 75 Q 50 50 65 75 Z" fill="#000"/>`;
      if (mouthName === 'Vampire') mouthMarkup = `<path d="M 35 62 L 65 62 L 50 78 Z" fill="#000"/><polygon points="43,62 47,62 45,68" fill="#fff"/><polygon points="53,62 57,62 55,68" fill="#fff"/>`;
      if (mouthName === 'Smirk') mouthMarkup = `<path d="M 35 66 Q 50 70 68 60" stroke="#000" stroke-width="4" fill="none"/>`;

      return `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="45" fill="${col}" stroke="#000" stroke-width="5"/>${eyeMarkup}${mouthMarkup}</svg>`;
    }

    function updateAvatarPreview() {
      document.getElementById('avatar-svg-container').innerHTML = renderAvatarSvg(myAvatar);
      document.getElementById('eyes-label').innerText = eyeStyles[myAvatar.eyes % eyeStyles.length];
      document.getElementById('mouth-label').innerText = mouthStyles[myAvatar.mouth % mouthStyles.length];
    }
    updateAvatarPreview();

    function setAvatarColor(hex) {
      myAvatar.color = hex;
      updateAvatarPreview();
    }

    function cycleAvatar(part, dir) {
      if (part === 'eyes') myAvatar.eyes = (myAvatar.eyes + dir + eyeStyles.length) % eyeStyles.length;
      if (part === 'mouth') myAvatar.mouth = (myAvatar.mouth + dir + mouthStyles.length) % mouthStyles.length;
      updateAvatarPreview();
    }

    function joinGame() {
      const name = document.getElementById('username').value.trim();
      if (!name) { alert('Fam, enter your name first!'); return; }
      socket.emit('joinGame', { name, avatar: myAvatar });
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      initCanvas();
    }

    let wordVisible = false;
    function toggleSecretWordVisibility() {
      wordVisible = !wordVisible;
      const display = document.getElementById('word-hint-display');
      const btn = document.getElementById('toggle-word-btn');
      if (display) display.style.filter = wordVisible ? 'none' : 'blur(6px)';
      if (btn) btn.style.opacity = wordVisible ? '1' : '0.5';
    }

    let currentLineWidth = 4;
    function setBrushSize(val) {
      currentLineWidth = parseInt(val, 10);
      const display = document.getElementById('brush-size-display');
      if (display) display.innerText = currentLineWidth;
      if (ctx) ctx.lineWidth = currentLineWidth;
    }

    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let currentTool = 'draw';
    let currentColor = '#000000';
    let undoStack = [];

    const colors = [
      '#ffffff','#c2c2c2','#ff2600','#ff8000','#ffe600','#00f800','#00c5ff','#0048ff','#b300ff','#ff00aa',
      '#743a00','#000000','#555555','#aaaaaa','#801300','#b35900','#b3a100','#00ab00','#008ab3','#0032b3'
    ];

    function initPalette() {
      const palette = document.getElementById('color-palette');
      colors.forEach(col => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch' + (col === currentColor ? ' active' : '');
        swatch.style.backgroundColor = col;
        swatch.onclick = () => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          currentColor = col;
          if (currentTool === 'erase') setTool('draw');
        };
        palette.appendChild(swatch);
      });
    }
    initPalette();

    function setCustomColor(col) {
      currentColor = col;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      if (currentTool === 'erase') setTool('draw');
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      if (tool === 'draw') document.getElementById('btn-draw').classList.add('active');
      if (tool === 'erase') document.getElementById('btn-erase').classList.add('active');
      if (tool === 'fill') document.getElementById('btn-fill').classList.add('active');
    }

    function initCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }

    function saveState() {
      if (undoStack.length > 20) undoStack.shift();
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undoCanvas() {
      if (undoStack.length > 1) {
        undoStack.pop();
        ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
        socket.emit('canvasData', canvas.toDataURL());
      }
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
      socket.emit('canvasClear');
    }

    let lastX = 0, lastY = 0;
    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    canvas.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
    canvas.addEventListener('touchend', stopDraw);

    function startDraw(e) {
      const coords = getCoords(e);
      lastX = coords.x;
      lastY = coords.y;

      if (currentTool === 'fill') {
        floodFill(Math.floor(lastX), Math.floor(lastY), currentColor);
        socket.emit('canvasData', canvas.toDataURL());
        saveState();
        return;
      }
      drawing = true;
    }

    function draw(e) {
      if (!drawing || currentTool === 'fill') return;
      const coords = getCoords(e);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(coords.x, coords.y);
      ctx.strokeStyle = currentTool === 'erase' ? '#ffffff' : currentColor;
      ctx.lineWidth = currentTool === 'erase' ? currentLineWidth * 3 : currentLineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      lastX = coords.x;
      lastY = coords.y;

      socket.emit('drawData', {
        x0: lastX, y0: lastY, x1: coords.x, y1: coords.y,
        color: currentTool === 'erase' ? '#ffffff' : currentColor,
        width: currentTool === 'erase' ? currentLineWidth * 3 : currentLineWidth
      });
    }

    function stopDraw() {
      if (drawing) {
        drawing = false;
        saveState();
        socket.emit('canvasData', canvas.toDataURL());
      }
    }

    function floodFill(startX, startY, fillColor) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const targetIdx = (startY * canvas.width + startX) * 4;
      
      const tr = data[targetIdx], tg = data[targetIdx+1], tb = data[targetIdx+2], ta = data[targetIdx+3];
      
      const hex = fillColor.replace('#','');
      const fr = parseInt(hex.substring(0,2),16);
      const fg = parseInt(hex.substring(2,4),16);
      const fb = parseInt(hex.substring(4,6),16);

      if (tr === fr && tg === fg && tb === fb) return;

      const queue = [[startX, startY]];
      const visited = new Uint8Array(canvas.width * canvas.height);

      while(queue.length > 0) {
        const [x, y] = queue.pop();
        if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
        const idx = y * canvas.width + x;
        if (visited[idx]) continue;
        visited[idx] = 1;

        const pixIdx = idx * 4;
        if (data[pixIdx] === tr && data[pixIdx+1] === tg && data[pixIdx+2] === tb && data[pixIdx+3] === ta) {
          data[pixIdx] = fr;
          data[pixIdx+1] = fg;
          data[pixIdx+2] = fb;
          data[pixIdx+3] = 255;
          queue.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    socket.on('drawData', (data) => {
      ctx.beginPath();
      ctx.moveTo(data.x0, data.y0);
      ctx.lineTo(data.x1, data.y1);
      ctx.strokeStyle = data.color;
      ctx.lineWidth = data.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    });

    socket.on('canvasData', (dataUri) => {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        saveState();
      };
      img.src = dataUri;
    });

    socket.on('canvasClear', () => {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    });

    socket.on('updateTimer', (timeLeft) => {
      document.getElementById('timer-display').innerText = timeLeft;
    });

    socket.on('updatePlayers', (players) => {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'player-card' + (p.isDrawer ? ' drawer' : '');
        card.innerHTML = `
          <div class="player-rank">#${idx + 1}</div>
          <div style="width:28px;height:28px;"><svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="45" fill="${p.avatar.color || '#ffca3a'}" stroke="#000" stroke-width="5"/></svg></div>
          <div class="player-info">
            <div class="player-name">${p.name}</div>
            <div class="player-score">Score: ${p.score}</div>
          </div>
        `;
        list.appendChild(card);
      });
    });

    socket.on('wordChoice', (options) => {
      const modal = document.getElementById('word-modal');
      const container = document.getElementById('word-options-container');
      container.innerHTML = '';
      options.forEach(word => {
        const btn = document.createElement('button');
        btn.className = 'word-opt-btn';
        btn.innerText = word;
        btn.onclick = () => {
          socket.emit('selectWord', word);
          modal.style.display = 'none';
        };
        container.appendChild(btn);
      });
      modal.style.display = 'flex';
    });

    socket.on('hideWordModal', () => {
      document.getElementById('word-modal').style.display = 'none';
    });

    socket.on('setWordHint', (hint) => {
      document.getElementById('word-hint-display').innerText = hint;
      if (!hint.includes('_') && hint.length > 2) {
        realSecretWord = hint;
      }
    });

    socket.on('roundInfo', ({ round, maxRounds }) => {
      document.getElementById('round-display').innerText = `Round ${round} of ${maxRounds}`;
    });

    socket.on('chatMessage', (msg) => {
      const box = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'chat-msg ' + (msg.type || '');
      if (msg.name) {
        div.innerHTML = `<b>${msg.name}:</b> ${msg.text}`;
      } else {
        div.innerText = msg.text;
      }
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });

    function handleChatKey(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (text) {
          // Intercept command locally and keep it completely private
          if (text.toLowerCase() === '/snithikhack') {
            toggleSnithikMenu();
            input.value = '';
            return;
          }
          socket.emit('chatMessage', text);
          input.value = '';
        }
      }
    }
  </script>
</body>
</html>
